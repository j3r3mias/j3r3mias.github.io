<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <title>Aula</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      text-align: center;
    }

    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }

    #offline {
      padding: 60px 16px;
      background: #1a1a1a;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      opacity: 0.8;
    }

    #unmute {
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      display: none;
    }
  </style>
</head>

<body>
  <h1>Aula</h1>

  <video id="player" controls autoplay muted playsinline style="display:none"></video>
  <div id="offline">Aguardando o início da transmissão..</div>
  <!-- <button id="unmute">Ativar som</button> -->

  <script>
    const HLS_URL = "https://aula.idp-moodle.site/aula/index.m3u8";
    const RETRY_MS = 5000;

    const video = document.getElementById("player");
    const offline = document.getElementById("offline");
    const unmuteBtn = document.getElementById("unmute");

    function showLive() {
      video.style.display = "block";
      offline.style.display = "none";
      unmuteBtn.style.display = "inline-block";
    }

    function showOffline() {
      video.style.display = "none";
      offline.style.display = "flex";
      unmuteBtn.style.display = "none";
    }

    unmuteBtn.addEventListener("click", () => {
      video.muted = false;
    });

    window.addEventListener("load", () => {
      if (!window.Hls || !Hls.isSupported()) {
        offline.textContent =
          "Seu navegador não suporta reprodução HLS (tente Chrome ou Firefox atualizados).";
        return;
      }

      const hls = new Hls();

      function tryLoad() {
        hls.loadSource(HLS_URL);
      }

      hls.on(Hls.Events.MEDIA_ATTACHED, tryLoad);

      hls.on(Hls.Events.MANIFEST_PARSED, showLive);

      hls.on(Hls.Events.ERROR, (_evt, data) => {
        if (data.fatal) {
          showOffline();
          setTimeout(tryLoad, RETRY_MS);
        }
      });

      video.onplay = () => {
        if (hls.liveSyncPosition) video.currentTime = hls.liveSyncPosition;
      };

      hls.attachMedia(video);
    });
  </script>
</body>

</html>
