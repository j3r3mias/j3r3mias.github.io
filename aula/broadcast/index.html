<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<title>Iniciar transmissão</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.2rem; }
  video {
    width: 100%;
    background: #000;
    border-radius: 8px;
    display: none;
  }
  label { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
  button {
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  #start { background: #2563eb; color: #fff; }
  #stop { background: #dc2626; color: #fff; display: none; }
  #status { margin-top: 16px; opacity: 0.8; white-space: pre-wrap; }
  #missing-token {
    background: #7f1d1d;
    padding: 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <h1>Transmissão da aula</h1>

  <div id="missing-token" style="display:none">
    Link inválido: falta o parâmetro <code>?token=</code> na URL.
    Abra o link completo gerado por <code>scripts/gen-token.py</code>.
  </div>

  <div id="app" style="display:none">
    <video id="preview" muted autoplay playsinline></video>

    <label>
      <input type="checkbox" id="audio-toggle" />
      Incluir áudio (microfone) — desligado por padrão
    </label>

    <button id="start">Iniciar transmissão</button>
    <button id="stop">Encerrar transmissão</button>

    <div id="status"></div>
  </div>

  <script src="publisher.js"></script>
  <script>
    // Endereço público do Caddy na VPS, que repassa para o MediaMTX.
    // https porque o token de publicação vai no header Authorization do
    // handshake WHIP — precisa ir criptografado. O certificado é do
    // Let's Encrypt, emitido e renovado pelo Caddy, então não há aviso
    // de segurança nem nada a aceitar no navegador.
    const MEDIAMTX_HOST = "https://aula.idp-moodle.site";
    const PATH = "aula";

    // O token é a credencial de publicação, então não pode ficar exposto na
    // barra de endereços enquanto o professor compartilha a tela: lemos da
    // query string, guardamos na sessão da aba e reescrevemos a URL sem ele.
    // O sessionStorage faz o token sobreviver a um F5 (e some quando a aba
    // fecha), então recarregar a página não exige abrir o link de novo.
    const TOKEN_KEY = "idp-class-stream-token";
    const params = new URLSearchParams(window.location.search);
    let token = params.get("token");

    if (token) {
      try {
        sessionStorage.setItem(TOKEN_KEY, token);
      } catch (err) {
        // Sessão restrita (storage bloqueado): seguimos só com o token em
        // memória — funciona, mas um F5 vai pedir o link outra vez.
      }
      history.replaceState({}, "", window.location.pathname);
    } else {
      try {
        token = sessionStorage.getItem(TOKEN_KEY);
      } catch (err) {
        token = null;
      }
    }

    const missingTokenEl = document.getElementById("missing-token");
    const appEl = document.getElementById("app");

    if (!token) {
      missingTokenEl.style.display = "block";
    } else {
      appEl.style.display = "block";
    }

    const preview = document.getElementById("preview");
    const audioToggle = document.getElementById("audio-toggle");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const statusEl = document.getElementById("status");

    let publisher = null;
    let screenStream = null;
    let micStream = null;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function start() {
      startBtn.disabled = true;
      setStatus("pedindo acesso à tela...");

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            // `max` e não `ideal`: o conteúdo é slide e código, então o que
            // importa é não redimensionar. Reduzir a captura é o que borra
            // texto pequeno — aqui a tela é capturada como está, e só entra
            // um teto para o caso de um monitor maior que 1080p.
            width: { max: 1920 },
            height: { max: 1080 },
            // Tela quase estática: 10 fps cobre slides e digitação, e sobra
            // bitrate para nitidez.
            frameRate: { ideal: 10, max: 15 },
            cursor: "always",
          },
          audio: false,
        });
      } catch (err) {
        setStatus("erro ao capturar a tela: " + err);
        startBtn.disabled = false;
        return;
      }

      const tracks = [...screenStream.getVideoTracks()];

      // Prioriza nitidez sobre fluidez: em queda de banda o Chrome derruba
      // o frame rate e preserva a resolução, em vez de borrar a imagem para
      // manter os quadros. É o comportamento certo para texto na tela.
      if ("contentHint" in tracks[0]) {
        tracks[0].contentHint = "text";
      }

      if (audioToggle.checked) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
          tracks.push(...micStream.getAudioTracks());
        } catch (err) {
          setStatus("não foi possível acessar o microfone (" + err + "), continuando sem áudio");
        }
      }

      const outStream = new MediaStream(tracks);
      preview.srcObject = outStream;
      preview.style.display = "block";

      // Se o usuário parar o compartilhamento pelo controle nativo do Chrome.
      screenStream.getVideoTracks()[0].addEventListener("ended", stop);

      publisher = new MediaMTXWebRTCPublisher({
        url: `${MEDIAMTX_HOST}/${PATH}/whip`,
        token: token,
        stream: outStream,
        // H264 e não VP8: o WebRTC aceitaria os dois, mas o HLS entregue
        // aos alunos não transporta VP8 — o MediaMTX não transcodifica,
        // então o que sai daqui é o que ele tem que empacotar. Publicar
        // em VP8 sobe normalmente e só falha do lado do aluno, com
        // "muxer instance not available".
        videoCodec: "h264",
        // Teto, não taxa constante: com slide parado o H264 manda muito
        // menos que isso. O teto só entra em cena em transição de slide e
        // rolagem de código, que é onde a nitidez do texto se decide.
        videoBitrate: 1200,
        audioCodec: "opus",
        audioBitrate: 32,
        audioVoice: true,
        onConnected: () => setStatus("ao vivo"),
        onError: (err) => setStatus("erro: " + err),
      });

      startBtn.style.display = "none";
      stopBtn.style.display = "inline-block";
    }

    function stop() {
      if (publisher !== null) {
        publisher.close();
        publisher = null;
      }
      for (const s of [screenStream, micStream]) {
        if (s !== null) {
          for (const t of s.getTracks()) t.stop();
        }
      }
      screenStream = null;
      micStream = null;

      preview.style.display = "none";
      preview.srcObject = null;
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
      stopBtn.style.display = "none";
      setStatus("encerrada");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);
    window.addEventListener("beforeunload", stop);
  </script>
</body>
</html>
